<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- square frame: reads as a solid dark tile on light backgrounds, a thin outline on dark ones -->
  <rect x="1.5" y="1.5" width="117" height="117" fill="#1A1A1A" stroke="#F5F0E7" stroke-width="2"/>
  <g transform="translate(-2 0)">
    <!-- stemless R: top bar, bowl, middle bar -->
    <path d="M35 33 H70.5 A16.25 16.25 0 0 1 70.5 65.5 H35" fill="none" stroke="#F5F0E7" stroke-width="5"/>
    <!-- leg, cut flat on the baseline -->
    <path d="M60.65 65.5 H67.35 L89.8 90.5 H83.1 Z" fill="#F5F0E7"/>
    <!-- dot where the stem would land -->
    <rect x="35" y="84.5" width="6" height="6" fill="#D9FA4C"/>
  </g>
</svg>
